server {
    # 课程平台 HTTPS 入口（IP 证书，Let's Encrypt shortlived）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/8.138.34.151.crt;
    ssl_certificate_key /etc/nginx/ssl/8.138.34.151.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /www/ctc/public;
    index index.php index.html;

    client_max_body_size 50m;
    access_log /var/log/nginx/ctc-ssl.access.log;
    error_log  /var/log/nginx/ctc-ssl.error.log;

    # 伪静态：全部交给入口文件
    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    # 演示视频：媒体目录位于 web 根之外，避免升级代码时丢失
    location ^~ /media/vod/ {
        alias /www/media/vod/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  HTTPS           on;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # 保护敏感文件
    location ~* /(config|db|storage|vendor)/ {
        deny all;
    }
    location ~* \.(sql|ini|log|md|lock|json)$ {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
