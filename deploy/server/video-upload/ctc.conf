server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /www/ctc/public;
    index index.php index.html;

    client_max_body_size 50m;
    access_log /var/log/nginx/ctc.access.log;
    error_log  /var/log/nginx/ctc.error.log;

    # 伪静态：全部交给入口文件
    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    # 演示视频：媒体目录位于 web 根之外，避免升级代码时丢失
    location ^~ /media/vod/ {
        alias /www/media/vod/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # 保护敏感文件
    location ~* /(config|db|storage|vendor)/ {
        deny all;
    }
    location ~* \.(sql|ini|log|md|lock|json)$ {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
